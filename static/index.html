<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻译工作台 · Translation Bench</title>
<style>
  :root{
    color-scheme:dark;
    --paper:#000;--paper-2:#090909;--panel:#050505;--panel-2:#0d0d0d;
    --ink:#f5f5f5;--ink-soft:#b8b8b8;--ink-faint:#747474;--line:#292929;--line-2:#5a5a5a;
    --verm:#fff;--verm-2:#d9d9d9;--verm-soft:#171717;--ok:#e7e7e7;--err:#fff;
    --mono:"Cascadia Code","JetBrains Mono","SFMono-Regular",Consolas,monospace;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  *{scrollbar-width:thin;scrollbar-color:#777 #0a0a0a}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:#0a0a0a;border-left:1px solid #242424}
  *::-webkit-scrollbar-thumb{background:#777;border:2px solid #0a0a0a;border-radius:0}
  *::-webkit-scrollbar-thumb:hover{background:#fff}
  *::-webkit-scrollbar-corner{background:#0a0a0a}
  html,body{height:100%}
  body{min-width:1180px;overflow:hidden;font:14px/1.55 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit}
  button{border:1px solid var(--line-2);border-radius:0;background:#080808;color:var(--ink);padding:8px 13px;cursor:pointer;transition:background .1s linear,color .1s linear,border-color .1s linear}
  button:hover:not(:disabled){border-color:#fff;background:#fff;color:#000}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid #fff;outline-offset:2px}
  button:disabled{opacity:.3;cursor:not-allowed}
  button[hidden]{display:none!important}
  button.primary{background:#fff;border-color:#fff;color:#000;font-weight:700}
  button.primary:hover:not(:disabled){background:#bfbfbf;border-color:#bfbfbf;color:#000}
  button.danger{color:#fff;border-color:#fff;background:#000}
  button.quiet{border-color:var(--line);background:#000;color:var(--ink-soft)}
  button.on{background:#fff;border-color:#fff;color:#000}

  header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #fff;background:#000}
  .brand h1{font:700 18px/1 var(--sans);letter-spacing:.12em}
  .srv{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font:12px var(--mono)}
  .dot{width:8px;height:8px;border-radius:0;background:#555}
  .dot.on{background:#fff}.dot.err{background:#fff;outline:1px solid #fff;outline-offset:2px}.dot.busy{background:#fff;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.3}}

  main{--config-w:280px;--queue-w:360px;height:calc(100vh - 58px);display:grid;grid-template-columns:var(--config-w) 6px var(--queue-w) 6px minmax(520px,1fr);overflow:hidden;background:#000}
  .config-panel,.queue-panel,.detail-panel{min-width:0;min-height:0;background:var(--panel);contain:layout paint}
  .config-panel{display:flex;flex-direction:column}
  .splitter{position:relative;background:#1c1c1c;border-left:1px solid #333;border-right:1px solid #333;cursor:col-resize;z-index:5;touch-action:none;transition:background .1s linear}
  .splitter:hover,.splitter.dragging{background:#fff;border-color:#fff}
  body.resizing{cursor:col-resize;user-select:none}
  .panel-head{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line-2);background:#050505}
  .panel-head h2{font-size:13px;font-weight:700;letter-spacing:.08em}.panel-head .sub{font:10px var(--mono);color:var(--ink-faint)}
  .config-scroll{flex:1;min-height:0;overflow:auto;padding:12px 12px 2px;scrollbar-gutter:stable}
  .sec{border:1px solid var(--line);border-radius:0;background:var(--panel-2);margin-bottom:10px;overflow:hidden}
  .sec>h3{padding:8px 10px;border-bottom:1px solid var(--line);background:#050505;color:var(--ink-soft);font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .fld{padding:8px 11px;border-bottom:1px solid var(--line)}.fld:last-child{border-bottom:0}
  .fld label{display:block;margin-bottom:4px;color:var(--ink-soft);font-size:11px}
  .fld input,.fld select,.fld textarea{width:100%;min-width:0;border:1px solid #3a3a3a;border-radius:0;outline:0;background:#000;color:#fff;padding:7px 8px;font:12px var(--mono)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#fff;box-shadow:none}
  .fld input:disabled,.fld select:disabled{opacity:.35;cursor:not-allowed}
  .config-note{margin-top:6px;color:var(--ink-faint);font-size:10px;line-height:1.45}
  .fld textarea{display:block;min-height:82px;resize:vertical;line-height:1.6}
  .fld .row{display:flex;gap:8px}.fld .row>div{flex:1;min-width:0}
  .config-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:7px 9px;text-align:left;font:12px var(--mono)}
  .config-toggle::after{content:attr(data-state);color:var(--ink-faint)}
  .config-toggle.on::after{color:#000}
  .config-actions{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;border-top:1px solid var(--line-2);background:#050505}
  .config-actions button{font-size:12px}

  .queue-panel{display:flex;flex-direction:column}
  .queue-head .count{padding:2px 6px;border:1px solid var(--line-2);border-radius:0;background:#000;color:var(--ink-soft);font:10px var(--mono)}
  .queue-controls{flex:none;padding:12px;border-bottom:1px solid var(--line-2);background:#090909}
  #drop{padding:13px;border:1px dashed var(--line-2);border-radius:0;text-align:center;background:#000;cursor:pointer;transition:.1s linear}
  #drop:hover,#drop.over{border-color:#fff;background:#fff;color:#000}
  #drop .big{font-weight:600;font-size:13px}#drop .small{color:var(--ink-faint);font-size:11px}#drop .small b{color:var(--verm)}
  #drop:hover .small,#drop.over .small,#drop:hover .small b,#drop.over .small b{color:#333}
  .task-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.task-actions button{min-width:0;padding:7px 10px;font-size:12px;white-space:nowrap}
  #progressBox{display:block;margin-top:10px}
  .progress-head{display:flex;align-items:center;justify-content:space-between;margin:5px 0 3px;color:var(--ink-faint);font:9px var(--mono)}
  .progress-head b{color:var(--ink-soft);font-weight:500;font-variant-numeric:tabular-nums}
  .progress-track{height:5px;border:1px solid #4a4a4a;border-radius:0;background:#000;overflow:hidden}
  .progress-track>i{display:block;width:0;height:100%;background:#fff;transition:width .15s linear}
  #fileBar>i{background:#aaa}
  #cur{min-height:17px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-faint);font:10px var(--mono)}
  #list{flex:1;min-height:0;overflow:auto;padding:0;display:flex;flex-direction:column;gap:0;scrollbar-gutter:stable;overflow-anchor:none;background:#000}
  .file{display:grid;grid-template-columns:30px auto auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 9px;border:0;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer;background:#000}
  .file:hover{background:#121212}.file.selected{border-color:#fff;background:#fff;color:#000;box-shadow:none}
  .file.current:not(.selected){background:#171717;border-left:4px solid #fff;padding-left:5px}
  .file .seq{color:var(--ink-faint);text-align:right;font:10px var(--mono);font-variant-numeric:tabular-nums;user-select:none}
  .file.selected .seq,.file.selected .nm{color:#000}
  .file .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  .file .meta{display:none}.file .err{grid-column:4/-1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--err);font-size:10px}
  .st{font:9px var(--mono);letter-spacing:.05em;padding:2px 5px;border:1px solid #555;border-radius:0;white-space:nowrap;background:#000;color:#aaa}
  .st.run{background:#fff;color:#000;border-color:#fff}.st.ok{background:#252525;color:#fff;border-color:#777}.st.err{background:#000;color:#fff;border-color:#fff}
  .file.selected .st{background:#fff;color:#000;border-color:#000}.file.selected .st.run{background:#000;color:#fff}.file.selected .err{color:#000}
  .file .pri{border:0;background:transparent;padding:3px;line-height:1;opacity:.35}.file .pri:hover{opacity:1;background:#fff;color:#000}.file .pri.on{opacity:1;color:#fff}.file.selected .pri{color:#000}.file .pri svg{width:13px;height:13px;display:block}
  .file .dl{border:0;background:transparent;padding:2px;color:var(--verm);font:10px var(--mono);text-decoration:underline}
  .file .retry{width:26px;height:26px;padding:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--err);background:transparent;border-color:transparent}
  .file .retry:hover:not(:disabled){border-color:#fff;background:#fff;color:#000}.file .retry svg{width:14px;height:14px}
  .file .retry.queued{color:#fff;border-color:#fff;background:#222}
  .file-actions{display:flex;align-items:center;justify-content:flex-end;gap:2px}
  .file .retranslate-file{width:26px;height:26px;padding:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);background:transparent;border-color:transparent}
  .file .retranslate-file:hover:not(:disabled){border-color:#fff;background:#fff;color:#000}.file .retranslate-file svg{width:14px;height:14px}
  .file .delete{width:26px;height:26px;padding:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-faint);background:transparent;border-color:transparent}
  .file .delete:hover:not(:disabled){border-color:#fff;background:#fff;color:#000}.file .delete svg{width:14px;height:14px}
  .file.selected .delete,.file.selected .retry,.file.selected .retranslate-file,.file.selected .dl{color:#000}
  .file.selected .delete:hover:not(:disabled),.file.selected .retry:hover:not(:disabled),.file.selected .retranslate-file:hover:not(:disabled){border-color:#000;background:#000;color:#fff}
  .queue-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line-2);color:var(--ink-faint);font:10px var(--mono);background:#050505}
  .queue-foot button{padding:4px 7px;font:10px var(--mono);white-space:nowrap}

  .detail-panel{display:flex;flex-direction:column;background:var(--paper)}
  .detail-head{min-height:50px;flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:7px 12px;padding:7px 16px;border-bottom:1px solid var(--line-2);background:#050505}
  .detail-title{flex:1;min-width:0}.detail-title strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.detail-title span{display:block;color:var(--ink-faint);font:10px var(--mono)}
  .pdf-range{order:3;flex:0 0 100%;display:flex;align-items:center;gap:8px;padding:6px 0 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink-soft);font:10px var(--mono);white-space:nowrap}
  .pdf-range[hidden]{display:none}.pdf-range .pdf-page-summary{min-width:0;max-width:min(52vw,520px);overflow:hidden;text-overflow:ellipsis;color:#fff}
  .pdf-range button{padding:4px 8px;font:10px var(--mono)}
  .detail-actions{display:flex;align-items:center;gap:7px}.detail-actions button{padding:6px 10px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
  #detail{flex:1;min-height:0;overflow:hidden;padding:0}
  .detail-empty{height:100%;display:grid;place-items:center;border:0;border-radius:0;color:var(--ink-faint);text-align:center;background:#000}.detail-empty strong{display:block;color:var(--ink-soft);font:600 15px var(--sans);margin-bottom:4px}
  .compare-wrap{--source-w:50%;position:relative;height:100%}
  .split{height:100%;overflow:auto;border:0;border-radius:0;background:#000;scrollbar-gutter:stable}
  .compare-splitter{position:absolute;z-index:4;top:0;bottom:0;left:var(--source-w);width:6px;transform:translateX(-3px);cursor:col-resize;touch-action:none;will-change:transform;background:#333;border-left:1px solid #555;border-right:1px solid #555;transition:background .1s linear}
  .compare-splitter:hover,.compare-splitter.dragging{background:#fff;border-color:#fff}
  .shead{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:var(--source-w) minmax(0,1fr) 42px;background:#0b0b0b;border-bottom:1px solid var(--line-2);color:var(--ink-soft);font:10px var(--mono);letter-spacing:.14em}
  .shead span{padding:9px 12px}.shead span:nth-child(n+2){border-left:1px solid var(--line)}.shead .line-action-head{padding:9px 0;text-align:center;letter-spacing:0}
  .srow{display:grid;grid-template-columns:var(--source-w) minmax(0,1fr) 42px;border-bottom:1px solid #1e1e1e}
  .srow:last-child{border-bottom:0}.srow:nth-child(odd){background:#070707}
  .srow .scell,.srow .dcell{min-width:0;padding:10px 12px;font-size:12px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .srow .scell{color:#a8a8a8}.srow .dcell{border-left:1px solid var(--line);color:#fff}
  .srow .empty{color:var(--ink-faint);font-style:italic}
  .line-action-cell{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line);background:#050505}
  .line-retranslate,.line-save{width:28px;height:28px;padding:6px;display:inline-flex;align-items:center;justify-content:center;border-color:transparent;background:transparent;color:var(--ink-soft)}
  .line-retranslate:hover:not(:disabled),.line-save:hover:not(:disabled){border-color:#fff;background:#fff;color:#000}.line-retranslate svg,.line-save svg{width:15px;height:15px}
  .line-retranslate.busy svg{animation:spin .8s linear infinite}
  .dcell[contenteditable="true"]{background:#fff!important;color:#000!important;outline:0;box-shadow:inset 0 0 0 1px #fff;cursor:text}
  .dcell[data-editable="true"]{cursor:text}.dcell[data-editable="true"]:hover{background:#101010}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{padding:28px 10px;text-align:center;color:var(--ink-faint);font-size:12px}
  .app-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.76)}
  .app-modal[hidden]{display:none}
  .app-modal-box{width:min(520px,calc(100vw - 48px));border:1px solid #fff;background:#050505;color:#fff;box-shadow:12px 12px 0 #1d1d1d}
  .app-modal-head{padding:13px 16px;border-bottom:1px solid #555;font-size:13px;font-weight:700;letter-spacing:.08em}
  .app-modal-message{min-height:78px;padding:18px 16px;white-space:pre-wrap;overflow-wrap:anywhere;color:#d0d0d0;line-height:1.7}
  .app-modal-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid #333}
  .app-modal-actions button{min-width:92px}
  .app-modal-actions button.modal-danger{border-color:#fff;background:#fff;color:#000;font-weight:700}
  .app-modal-actions button.modal-danger:hover:not(:disabled){background:#bfbfbf;border-color:#bfbfbf}
  .pdf-page-modal-box{width:min(760px,calc(100vw - 48px))}
  .pdf-page-picker{padding:14px 16px}.pdf-page-picker-summary{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--ink-soft);font:11px var(--mono)}
  .pdf-page-picker-summary span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .pdf-page-picker-tools{display:flex;gap:7px;margin-bottom:10px}.pdf-page-picker-tools button{padding:5px 9px;font:10px var(--mono)}
  .pdf-page-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;max-height:min(52vh,460px);overflow:auto;padding:8px;border:1px solid #333;background:#000;scrollbar-gutter:stable}
  .pdf-page-grid button{height:34px;padding:0;border-color:#333;background:#080808;color:var(--ink-soft);font:11px var(--mono);font-variant-numeric:tabular-nums}
  .pdf-page-grid button.selected{border-color:#fff;background:#fff;color:#000;font-weight:700}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>翻译工作台</h1>
  </div>
  <div class="srv">
    <span class="dot" id="dot"></span><span id="srvTxt">检测服务器…</span>
  </div>
</header>

<main>
  <!-- 配置 -->
  <aside class="config-panel">
    <div class="panel-head"><h2>配置</h2><span class="sub">CONFIG</span></div>
    <div class="config-scroll">
    <div class="sec">
      <h3>模型 · 服务</h3>
      <div class="fld"><label>服务地址</label>
        <input id="cfg_server" placeholder="http://127.0.0.1:8081"></div>
      <div class="fld"><label>API 密钥</label>
        <input id="cfg_key" type="password" autocomplete="off" placeholder="未启用鉴权时留空"></div>
      <div class="fld"><label>模型名</label>
        <input id="cfg_model" placeholder="hy-mt2-7b"></div>
      <div class="fld"><label>上下文长度</label>
        <input id="cfg_ctx" type="number" min="2048" step="1024" value="65536"></div>
    </div>

    <div class="sec">
      <h3>采样 · 生成</h3>
      <div class="fld"><div class="row">
        <div><label>temperature</label><input id="cfg_temp" type="number" step="0.05" value="0.7"></div>
        <div><label>top_k</label><input id="cfg_topk" type="number" value="20"></div>
      </div></div>
      <div class="fld"><div class="row">
        <div><label>top_p</label><input id="cfg_topp" type="number" step="0.05" value="0.6"></div>
        <div><label>repeat_penalty</label><input id="cfg_rp" type="number" step="0.05" value="1.05"></div>
      </div></div>
      <div class="fld"><label>推理控制</label>
        <button id="cfg_thinking" class="config-toggle" type="button" data-enabled="false" data-state="关闭" aria-pressed="false">思考模式</button></div>
    </div>

    <div class="sec">
      <h3>翻译 · 分块</h3>
      <div class="fld"><label>补充要求（可选）</label>
        <textarea id="cfg_sys" rows="4" placeholder="例如：特定人名保持原文，术语按指定译法"></textarea></div>
      <div class="fld"><label>翻译风格</label>
        <select id="cfg_style">
          <option selected>自动判断</option>
          <option>通用自然</option>
          <option>剧情文学</option>
          <option>专业技术</option>
          <option>对话字幕</option>
          <option>正式商务</option>
          <option>学术论文</option>
          <option>轻小说网文</option>
        </select></div>
      <div class="fld"><label>上下文模式</label>
        <select id="cfg_context_mode">
          <option value="full" selected>1 · 尽量全文</option>
          <option value="neighbor">2 · 邻近上下文</option>
          <option value="unit">3 · 独立单元</option>
        </select>
        <div class="config-note" id="contextModeHint"></div>
      </div>
      <div class="fld"><div class="row">
        <div><label>源语言</label>
          <select id="cfg_src">
            <option>自动判断</option>
            <option>中文</option><option>繁体中文</option><option>粤语</option><option>藏文</option>
            <option>英文</option><option>法文</option><option>西班牙文</option><option>葡萄牙文</option>
            <option>德文</option><option>意大利文</option><option>荷兰文</option><option>瑞典文</option>
            <option>波兰文</option><option>捷克文</option><option>斯洛伐克文</option><option>斯洛文尼亚文</option>
            <option>克罗地亚文</option><option>塞尔维亚文</option><option>罗马尼亚文</option><option>匈牙利文</option>
            <option>保加利亚文</option><option>乌克兰文</option><option>希腊文</option><option>立陶宛文</option>
            <option>俄文</option><option>韩文</option><option>泰文</option><option>越南文</option>
            <option>马来文</option><option>印尼文</option><option>菲律宾文</option><option>印地文</option>
            <option>孟加拉文</option><option>乌尔都文</option><option>泰米尔文</option><option>泰卢固文</option>
            <option>马拉地文</option><option>古吉拉特文</option><option>阿拉伯文</option><option>希伯来文</option>
            <option>波斯文</option><option>高棉文</option><option>缅甸文</option><option>哈萨克文</option>
            <option>蒙古文</option><option>维吾尔文</option>
            <option>日文</option>
          </select></div>
        <div><label>目标语言</label>
          <select id="cfg_tgt">
            <option selected>中文</option><option>繁体中文</option><option>粤语</option><option>藏文</option>
            <option>英文</option><option>法文</option><option>西班牙文</option><option>葡萄牙文</option>
            <option>德文</option><option>意大利文</option><option>荷兰文</option><option>瑞典文</option>
            <option>波兰文</option><option>捷克文</option><option>斯洛伐克文</option><option>斯洛文尼亚文</option>
            <option>克罗地亚文</option><option>塞尔维亚文</option><option>罗马尼亚文</option><option>匈牙利文</option>
            <option>保加利亚文</option><option>乌克兰文</option><option>希腊文</option><option>立陶宛文</option>

  if(modalResolve) closeAppModal(modalCancelValue);
  $('appModalTitle').textContent=title;
  $('appModalMessage').textContent=message;
  const actionBox=$('appModalActions');
  actionBox.innerHTML='';

      if(action.focus) requestAnimationFrame(()=>button.focus());

/* ---------- 可调三栏宽度 ---------- */
const workspace = document.querySelector('main');
function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
function calculateLayout(configWidth, queueWidth, total=workspace.clientWidth){
  const configMax = Math.max(220, Math.min(420, total - 280 - 12 - 520));
  const cfg = clamp(Number(configWidth)||280, 220, configMax);
  const queueMax = Math.max(280, total - cfg - 12 - 520);
  const queue = clamp(Number(queueWidth)||360, 280, Math.min(560, queueMax));
  return {config:cfg, queue};
}
function applyLayout(configWidth, queueWidth, save=false){
  const size=calculateLayout(configWidth, queueWidth);
  const cfg=size.config, queue=size.queue;
  workspace.style.setProperty('--config-w', cfg + 'px');
  workspace.style.setProperty('--queue-w', queue + 'px');
  if(save) localStorage.setItem('bench_layout', JSON.stringify({config:cfg, queue}));
}
try{
  const layout = JSON.parse(localStorage.getItem('bench_layout')) || {};
  applyLayout(layout.config, layout.queue);
}catch(_){ applyLayout(280,360); }
compareRatio = clamp(parseFloat(localStorage.getItem('bench_compare_ratio')) || 50, 25, 75);
document.querySelectorAll('.splitter').forEach(handle => {
  handle.addEventListener('pointerdown', e => {
    e.preventDefault(); handle.setPointerCapture(e.pointerId); handle.classList.add('dragging');
    document.body.classList.add('resizing');
    const startX = e.clientX;
    const styles = getComputedStyle(workspace);
    const startConfig = parseFloat(styles.getPropertyValue('--config-w'));
    const startQueue = parseFloat(styles.getPropertyValue('--queue-w'));
    const total=workspace.clientWidth;
    let latestX=startX, frame=0, targetConfig=startConfig, targetQueue=startQueue;
    const preview = () => {
      frame=0;
      const delta=latestX-startX;
      if(handle.dataset.split === 'config'){
        const maxConfig=Math.max(220,Math.min(420,total-startQueue-12-520));
        targetConfig=clamp(startConfig+delta,220,maxConfig);
        targetQueue=startQueue;
      }else{
        const maxQueue=Math.max(280,Math.min(560,total-startConfig-12-520));
        targetConfig=startConfig;
        targetQueue=clamp(startQueue+delta,280,maxQueue);
      }
      workspace.style.setProperty('--config-w', targetConfig + 'px');
      workspace.style.setProperty('--queue-w', targetQueue + 'px');
    };
    const move = ev => {
      latestX=ev.clientX;
      if(!frame) frame=requestAnimationFrame(preview);
    };
    const up = () => {
      if(frame){ cancelAnimationFrame(frame); preview(); }
      handle.classList.remove('dragging'); document.body.classList.remove('resizing');
      handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      applyLayout(targetConfig,targetQueue,true);
    };
    handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
});
window.addEventListener('resize', () => {
  const styles = getComputedStyle(workspace);
  applyLayout(parseFloat(styles.getPropertyValue('--config-w')), parseFloat(styles.getPropertyValue('--queue-w')));
});

const MAX_BINARY_FILE_BYTES=50*1024*1024;
const PDF_EXTRACTION_VERSION=5;
function pdfPageNumbers(file){
  const total=Math.max(0,Number(file?.pdf_page_count||0));
  if(!total) return [];
  const value=String(file?.pdf_page_selection||'').trim().toLowerCase();
  if(value==='all') return Array.from({length:total},(_,index)=>index+1);
  const selected=new Set();
  if(value){
    let valid=true;
    for(const token of value.split(',')){
      const match=token.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);
      if(!match){ valid=false; break; }
      const first=Number(match[1]), last=Number(match[2]||match[1]);
      if(first<1 || last>total || first>last){ valid=false; break; }
      for(let page=first;page<=last;page++) selected.add(page);
    }
    if(valid && selected.size) return [...selected].sort((a,b)=>a-b);
  }
  const first=Math.max(1,Math.min(total,Number(file?.pdf_page_start||1)));
  const last=Math.max(first,Math.min(total,Number(file?.pdf_page_end||total)));
  return Array.from({length:last-first+1},(_,index)=>first+index);
}
function formatPdfPageSelection(pageNumbers,total){
  const pages=[...new Set(pageNumbers.map(Number).filter(page=>Number.isInteger(page)&&page>=1&&page<=total))].sort((a,b)=>a-b);
  if(pages.length===total) return 'all';
  const ranges=[];
  for(let index=0;index<pages.length;){
    const first=pages[index]; let last=first;
    while(index+1<pages.length && pages[index+1]===last+1){ last=pages[++index]; }
    ranges.push(first===last ? String(first) : `${first}-${last}`);
    index++;
  }
  return ranges.join(',');
}
function pdfPageSelectionLabel(file,compact=false){
  const total=Number(file?.pdf_page_count||0), pages=pdfPageNumbers(file);
  if(!total) return '';
  if(pages.length===total) return `全部 ${total} 页`;
  const value=formatPdfPageSelection(pages,total);
  return compact ? `已选 ${pages.length}/${total} 页` : `已选 ${pages.length} / ${total} 页 · ${value}`;
}
function fileExtension(name){ return (String(name).match(/\.[^.]+$/)?.[0]||'').toLowerCase(); }
function normalizeTextSource(raw){
  let text=String(raw??''), text_bom=text.startsWith('\ufeff');
  if(text_bom) text=text.slice(1);
  const crlf=(text.match(/\r\n/g)||[]).length;
  const remainder=text.replace(/\r\n/g,'');
  const cr=(remainder.match(/\r/g)||[]).length, lf=(remainder.match(/\n/g)||[]).length;
  const text_eol=crlf>=Math.max(cr,lf)&&crlf ? 'crlf' : (cr>lf ? 'cr' : 'lf');
  return {content:text.replace(/\r\n/g,'\n').replace(/\r/g,'\n'),text_eol,text_bom};
}
async function importTextFile(file){
  const bytes=new Uint8Array(await file.arrayBuffer());
  const hasUtf8Bom=bytes.length>=3 && bytes[0]===0xef && bytes[1]===0xbb && bytes[2]===0xbf;
  if(bytes.length>=2 && ((bytes[0]===0xff&&bytes[1]===0xfe)||(bytes[0]===0xfe&&bytes[1]===0xff))){
    throw new Error('暂不支持 UTF-16 文本，请先另存为 UTF-8');
  }
  let decoded;
  try{ decoded=new TextDecoder('utf-8',{fatal:true}).decode(bytes); }
  catch(_){ throw new Error('文本不是有效的 UTF-8 编码'); }
  const normalized=normalizeTextSource(decoded);
  normalized.text_bom=hasUtf8Bom;
  return {...normalized,source_id:null,source_format:'text',source_sha256:null,
    pdf_page_count:null,pdf_page_start:null,pdf_page_end:null,pdf_page_selection:null,
    pdf_extraction_version:null};
}
function arrayBufferToBase64(buffer){
  const bytes=new Uint8Array(buffer), chunks=[];
  for(let offset=0;offset<bytes.length;offset+=0x8000){
    chunks.push(String.fromCharCode(...bytes.subarray(offset,offset+0x8000)));
  }
  return btoa(chunks.join(''));
}
async function importBinaryFile(file){
  $('cur').textContent='正在导入：' + file.name;
  const encoded=arrayBufferToBase64(await file.arrayBuffer());
  const response=await fetch('/api/import', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:file.name,data_base64:encoded})
  });
  const result=await response.json().catch(() => ({}));
  if(!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
  return result;
}
async function releaseSource(file){
  if(!file?.source_id) return true;
  try{
    const response=await fetch('/api/source?id=' + encodeURIComponent(file.source_id), {method:'DELETE'});
    return response.ok;
  }catch(_){ return false; }
}

async function addFiles(list){
  for(const f of list){
    const extension=fileExtension(f.name);
    if(!TEXT_DOCUMENT_EXTENSIONS.includes(extension) && !BINARY_DOCUMENT_EXTENSIONS.includes(extension)){
      await appAlert(`暂不支持“${f.name}”。\n\n当前支持 Markdown、纯文本、SRT、WebVTT、DOCX、EPUB 和带文字层的 PDF。`,'不支持的格式');
      continue;
    }
    if(BINARY_DOCUMENT_EXTENSIONS.includes(extension) && f.size>MAX_BINARY_FILE_BYTES){
      await appAlert(`“${f.name}”超过 50MB，无法导入。`,'文件过大');
      continue;
    }
    const existing = files.find(x => x.name.toLocaleLowerCase() === f.name.toLocaleLowerCase());
    let imported;
    try{
      if(BINARY_DOCUMENT_EXTENSIONS.includes(extension)){
        imported=await importBinaryFile(f);
      }else{
        imported=await importTextFile(f);
      }
    }catch(error){
      await appAlert(`导入“${f.name}”失败：${error.message}`,'导入失败');
      continue;
    }
    const content=imported.content;
    if(existing){
      if(jobId || submitting || lineRetranslating || lineSaving || lineEditing){
        if(imported.source_id) await releaseSource(imported);
        await appAlert('任务运行或译文编辑期间不能替换同名文件。','暂时无法替换');
        continue;
      }
      const binary=BINARY_DOCUMENT_EXTENSIONS.includes(extension);
      const sourceChanged=existing.name!==f.name || (binary
        ? (existing.source_sha256
          ? existing.source_sha256!==imported.source_sha256
          : existing.content!==content) ||
          (extension==='.pdf' && (
            formatPdfPageSelection(pdfPageNumbers(existing),Number(existing.pdf_page_count||0))!==
              String(imported.pdf_page_selection||'all') ||
            Number(existing.pdf_page_start||1)!==Number(imported.pdf_page_start||1) ||
            Number(existing.pdf_page_end||imported.pdf_page_count)!==Number(imported.pdf_page_end||imported.pdf_page_count)
          ))
        : existing.content!==content || (existing.text_eol||'lf')!==(imported.text_eol||'lf') ||
          !!existing.text_bom!==!!imported.text_bom);
      if(sourceChanged){
        const replace=await appConfirm(
          `任务列表中已有同名文件“${f.name}”。\n\n是否用新文件替换？现有预览、译文状态和续译断点将被清除，已保存的磁盘译文不会自动删除。`,
          '替换同名文件'
        );
        if(!replace){
          if(imported.source_id) await releaseSource(imported);
          continue;
        }
      }
      if(existing.source_id && existing.source_id!==imported.source_id) await releaseSource(existing);
      existing.name=f.name;
      existing.content=content;
      existing.source_id=imported.source_id||null;
      existing.source_format=imported.source_format||'text';
      existing.source_sha256=imported.source_sha256||null;
      existing.pdf_page_count=imported.pdf_page_count||null;
      existing.pdf_page_start=imported.pdf_page_start||null;
      existing.pdf_page_end=imported.pdf_page_end||null;
      existing.pdf_page_selection=imported.pdf_page_selection||null;
      existing.pdf_extraction_version=imported.pdf_extraction_version||null;
      existing.text_eol=imported.text_eol||'lf';
      existing.text_bom=!!imported.text_bom;
      if(sourceChanged){
        existing.status='q'; existing.error=''; existing.content_out=null;
        existing.live_out={}; existing.completed_lines={}; existing.resume_retranslate=false;
        existing.legacy_out=''; existing.output_name=null; existing.target_language=null;
        existing.priority=false; existing.retry_queued=false;
      }
      continue;
    }
    files.push({name:f.name, content, status:'q', error:'', content_out:null,
      live_out:{}, completed_lines:{}, resume_retranslate:false, legacy_out:'',
      output_name:null, target_language:null, priority:false, retry_queued:false,
      source_id:imported.source_id||null, source_format:imported.source_format||'text',
      source_sha256:imported.source_sha256||null, text_eol:imported.text_eol||'lf',
      text_bom:!!imported.text_bom, pdf_page_count:imported.pdf_page_count||null,
      pdf_page_start:imported.pdf_page_start||null, pdf_page_end:imported.pdf_page_end||null,
      pdf_page_selection:imported.pdf_page_selection||null,
      pdf_extraction_version:imported.pdf_extraction_version||null});
  }
  $('cur').textContent='';
  if(selectedIdx < 0 && files.length) selectedIdx = 0;
  render();
  markOutputsDone();   // 标记后台已翻译过的文件
}
$('btnClear').addEventListener('click', async () => {
  if(!files.length || jobId || submitting || lineRetranslating || lineSaving || lineEditing) return;
  const confirmed=await appConfirm(
    `清空任务列表中的 ${files.length} 个文件？\n\n未完成译文和续译断点会从浏览器中移除，outputs 中已经保存的译文不会删除。`,
    '清空任务列表'
  );
  if(!confirmed) return;
  await Promise.allSettled(files.map(releaseSource));
  files=[]; selectedIdx=-1;
  updateTotalProgress(0,0); updateFileProgress(0,0);
  $('cur').textContent='';
  render();
});
$('btnClearCache').addEventListener('click', async () => {
  if(jobId || submitting || lineRetranslating || lineSaving || lineEditing) return;
  const completed = files.filter(file => file.status === 'ok').length;
  const confirmed = await appConfirm(
    `清除完成记录和恢复缓存？${completed ? `\n\n任务列表中将移除 ${completed} 个已完成任务。` : ''}\n\noutputs 中的实际译文不会被删除。`,
    '清除缓存'
  );
  if(!confirmed) return;
  try{
    const response = await fetch('/api/cache', {method:'DELETE'});
    const result = await response.json();
    if(!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
    const selectedFile = files[selectedIdx] || null;
    await Promise.allSettled(files.filter(file => file.status === 'ok').map(releaseSource));
    files = files.filter(file => file.status !== 'ok');
    selectedIdx = selectedFile && files.includes(selectedFile)
      ? files.indexOf(selectedFile)
      : (files.length ? 0 : -1);
    lastJob=null; currentName=''; trackingProgress=false;
    localStorage.removeItem('bench_lastjob');
    updateTotalProgress(0,0); updateFileProgress(0,0);
    $('cur').textContent='缓存已清除，磁盘译文已保留';
    render();
  }catch(error){
    await appAlert('清除缓存失败：' + error.message,'清除失败');
  }
});

/* ---------- 渲染 ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function sourceLineInfo(lines, filename=''){
  let inFence=false;
  const info=lines.map(rawLine => {
    // File.text() 会保留 Windows CRLF 中的 \r；先去掉物理行尾，避免正则匹配失败。
    const line=String(rawLine).replace(/\r$/,'');
    if(/^(\s*)(```|~~~)/.test(line)){ inFence=!inFence; return {translate:false,prefix:'',suffix:''}; }
    if(inFence || !line.trim() || /^(?: {4}|\t)/.test(line)) return {translate:false,prefix:'',suffix:''};
    if(/^\s{0,3}(?:(?:\*\s*){3,}|(?:-\s*){3,}|(?:_\s*){3,})$/.test(line)) return {translate:false,prefix:'',suffix:''};
    const patterns = [
      /^(\s{0,3}#{1,6}[ \t]+)(.*?)([ \t]*)$/,
      /^(\s*(?:>\s*)*(?:[-+*]|\d+[.)])\s+\[[ xX]\]\s+)(.*?)([ \t]*)$/,
      /^(\s*(?:>\s*)*(?:[-+*]|\d+[.)])\s+)(.*?)([ \t]*)$/,
      /^(\s*(?:>\s*)+)(.*?)([ \t]*)$/,
    ];
    for(const pattern of patterns){
      const match=line.match(pattern);
      if(match) return {translate:!!match[2],prefix:match[1],suffix:match[3]};
    }
    const plain=line.match(/^(\s*)(.*?)([ \t]*)$/);
    if(!plain) return {translate:false,prefix:'',suffix:''};
    return {translate:!!plain[2],prefix:plain[1],suffix:plain[3]};
  });
  const extension=(String(filename).match(/\.[^.]+$/)?.[0]||'').toLowerCase();
  const plainDocument=['.srt','.vtt','.docx','.epub','.pdf'].includes(extension);
  if(plainDocument){
    // 字幕中的 "- " 不是 Markdown 列表；容器预览行也都是已经提取的纯文本单元。
    lines.forEach((rawLine,index) => {
      const line=String(rawLine).replace(/\r$/,'');
      const plain=line.match(/^(\s*)(.*?)([ \t]*)$/);
      info[index]=plain && plain[2]
        ? {translate:true,prefix:plain[1],suffix:plain[3]}
        : {translate:false,prefix:'',suffix:''};
    });
  }
  if(extension!=='.srt' && extension!=='.vtt') return info;
  const preserve=index => { info[index]={translate:false,prefix:'',suffix:''}; };
  const timestamp=/^\s*(?:\d{1,3}:)?\d{2}:\d{2}[,.]\d{3}\s+-->\s+(?:\d{1,3}:)?\d{2}:\d{2}[,.]\d{3}(?:\s+.*)?$/;
  if(extension==='.vtt' && lines.length && String(lines[0]).replace(/^\uFEFF/,'').trim().startsWith('WEBVTT')){
    for(let i=0;i<lines.length;i++){
      preserve(i);
      if(i>0 && !String(lines[i]).trim()) break;
    }
  }
  let block=false;
  lines.forEach((rawLine,index) => {
    const line=String(rawLine).replace(/\r$/,'');
    const stripped=line.trim();
    if(extension==='.vtt'){
      if(/^(?:NOTE(?:\s|$)|STYLE$|REGION$)/.test(stripped)) block=true;
      if(block){ preserve(index); if(!stripped) block=false; return; }
    }
    if(!stripped){ preserve(index); return; }
    if(timestamp.test(line)){
      preserve(index);
      if(index>0 && String(lines[index-1]).trim()){
        const previous=String(lines[index-1]).trim();
        if(extension==='.vtt' || /^\d+$/.test(previous)) preserve(index-1);
      }
    }
  });
  return info;
}

function translatedLineBody(info, translatedLine){
  let text=String(translatedLine||'');
  if(info.prefix && text.startsWith(info.prefix)) text=text.slice(info.prefix.length);
  if(info.suffix && text.endsWith(info.suffix)) text=text.slice(0,-info.suffix.length);
  return text;
}

function splitHtml(i){
  const f = files[i];
  if(!f) return '';
  // 使用物理行号对齐，SSE 乱序/重连时也不会把译文配到错行。
  const src = typeof f.content === 'string' ? f.content.split('\n') : [];
  const completed = f.content_out !== null;
  const dst = completed ? String(f.content_out).split('\n') : [];
  const live = f.live_out || {};
  const lineInfo = sourceLineInfo(src, f.name);
  // 兼容修复前已在运行的后端：旧 chunk 没有物理行号，按非空行顺序对齐。
  const legacy = {};
  if(!completed && !Object.keys(live).length && f.legacy_out){
    const sourceRows = src.map((line, idx) => line.trim() ? idx : -1).filter(idx => idx >= 0);
    String(f.legacy_out).split('\n').filter(line => line.trim()).forEach((line, idx) => {
      const targetRow = sourceRows[idx] !== undefined ? sourceRows[idx] : idx;
      legacy[targetRow] = line;
    });
  }
  let rows = '<div class="shead"><span>原文</span><span>译文</span><span class="line-action-head">重译</span></div>';
  const n = Math.max(src.length, dst.length,
    ...Object.keys(live).map(Number).map(x=>x+1),
    ...Object.keys(legacy).map(Number).map(x=>x+1), 0);
  for(let k=0;k<n;k++){
    const s = src[k] || '';
    // 整篇重译时保留旧译文作底稿，但当前行一旦收到新 token 就立即
    // 覆盖显示；其他尚未开始的行仍保持旧译文，不会突然清空全文。
    const hasLive = Object.prototype.hasOwnProperty.call(live, String(k));
    const d = hasLive ? live[k] : (completed ? (dst[k] || '') : (legacy[k] || ''));
    if(!s.trim() && !d.trim()) continue;
    const isBusy = lineRetranslating && lineRetranslating.name===f.name && lineRetranslating.line===k;
    const lineButton = completed && lineInfo[k]?.translate
      ? `<button class="line-retranslate${isBusy?' busy':''}" data-line="${k}" title="重新翻译这一行" aria-label="重新翻译第 ${k+1} 行" ${jobId||submitting||lineRetranslating||lineSaving||lineEditing?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v5h-5"/><path d="M18.2 15a7 7 0 1 1-.7-7.8L20 11"/></svg></button>`
      : '';
    const saveButton = completed && lineInfo[k]?.translate
      ? `<button class="line-save" data-line="${k}" title="保存这一行" aria-label="保存第 ${k+1} 行" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></button>`
      : '';
    const editable = completed && lineInfo[k]?.translate ? ' data-editable="true" title="双击编辑译文"' : '';
    rows += `<div class="srow" data-line="${k}"><div class="scell${s?'':' empty'}">${esc(s)||'…'}</div><div class="dcell${d?'':' empty'}"${editable}>${esc(d)||'…'}</div><div class="line-action-cell">${lineButton}${saveButton}</div></div>`;
  }
  return rows;
}

function render(){
  if(selectedIdx < 0 && files.length) selectedIdx = 0;
  if(selectedIdx >= files.length) selectedIdx = files.length - 1;
  $('count').textContent = files.length + ' 个文件';
  const runnable = unfinishedFiles();
  const failedRunnable = runnable.filter(f => f.status === 'err');
  const runnableSet = new Set(runnable);
  $('btnGo').disabled = files.length === 0 || submitting || !!lineRetranslating || lineSaving || !!lineEditing || (jobId !== null) || runnable.length === 0;
  $('btnGo').textContent = submitting ? '正在启动' : (jobId ? '翻译中'
    : (failedRunnable.length === runnable.length && failedRunnable.length
      ? `重试失败（${failedRunnable.length}）`
      : (failedRunnable.length ? `继续并重试（${runnable.length}）` : '开始翻译')));
  $('btnStop').disabled = !jobId || interrupting;
  $('btnStop').textContent = interrupting ? '正在中断…' : '中断';
  $('btnZip').disabled = !lastJob || !!lineRetranslating || lineSaving || !!lineEditing;
  $('btnClear').disabled = files.length === 0 || !!jobId || !!lineRetranslating || lineSaving || !!lineEditing;
  $('btnClearCache').disabled = !!jobId || submitting || !!lineRetranslating || lineSaving || !!lineEditing;
  const list = $('list');
  if(files.length === 0){
    taskListScrollTop = 0;
    list.innerHTML='<div class="empty">尚未添加文档</div>';
    list.scrollTop = 0;
    renderDetail(); persist(); return;
  }
  const savedScrollTop = list.scrollTop || taskListScrollTop;
  list.innerHTML = files.map((f,i) => {
    const stMap = {q:['待译','q'], run:['翻译中','run'], ok:['完成','ok'], err:['失败','err']};
    const [label, cls] = stMap[f.status] || ['待译','q'];
    const dl = f.status==='ok' && f.content_out !== null ? `<button class="dl" data-i="${i}" ${lineRetranslating||lineSaving||lineEditing?'disabled':''}>下载</button>` : '';
    const retryDisabled = typeof f.content !== 'string';
    const retryTitle = retryDisabled ? '原文未保留，请重新添加文件'
      : (jobId ? (f.retry_queued ? '已加入批次结束后的重试队列，点击取消' : '当前批次结束后自动重试') : '重试该文件');
    const retry = f.status==='err' ? `<button class="retry${f.retry_queued?' queued':''}" data-i="${i}" title="${retryTitle}" aria-label="重试该文件" ${retryDisabled||lineRetranslating||lineSaving||lineEditing?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v5h-5"/><path d="M18.2 15a7 7 0 1 1-.7-7.8L20 11"/></svg></button>` : '';
    const wholeRetranslate = f.status==='ok' && f.content_out !== null && typeof f.content==='string'
      ? `<button class="retranslate-file" data-i="${i}" title="重新翻译整个文件" aria-label="重新翻译整个文件" ${jobId||submitting||lineRetranslating||lineSaving||lineEditing?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v5h-5"/><path d="M18.2 15a7 7 0 1 1-.7-7.8L20 11"/></svg></button>`
      : '';
    const remove = `<button class="delete" data-i="${i}" title="从任务列表删除" aria-label="删除任务" ${jobId||submitting||lineRetranslating||lineSaving||lineEditing?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 10v6M14 10v6"/></svg></button>`;
    const actions = `<span class="file-actions">${dl}${wholeRetranslate}${retry}${remove}</span>`;
    const err = f.error ? `<span class="err">${esc(f.error)}</span>` : '';
    const canPrioritize = runnableSet.has(f) && f.name !== currentName && (!jobId || f.status === 'q');
    const priorityTitle = jobId ? '安排为当前任务的下一个任务' : '移动到队列最前';
    const classes = ['file', i===selectedIdx?'selected':'', f.name===currentName?'current':''].filter(Boolean).join(' ');
    return `<div class="${classes}" data-fi="${i}">
      <span class="seq" aria-label="任务序号 ${i+1}">${i+1}</span>
      <button class="pri${f.priority?' on':''}" data-i="${i}" title="${priorityTitle}" aria-label="${priorityTitle}" ${canPrioritize?'':'disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 11-5-5-5 5M17 18l-5-5-5 5"/></svg></button>
      <span class="st ${cls}">${label}</span>
      <span class="nm" title="${escAttr(f.name)}">${esc(f.name)}</span>
      ${actions}${err}
    </div>`;
  }).join('');
  list.querySelectorAll('.file').forEach(row => row.onclick = () => selectFile(+row.dataset.fi));
  list.querySelectorAll('.dl').forEach(b => b.onclick = e => { e.stopPropagation(); download(b.dataset.i); });
  list.querySelectorAll('.retry').forEach(b => b.onclick = e => {
    e.stopPropagation(); if(!b.disabled) retryFile(+b.dataset.i);
  });
  list.querySelectorAll('.retranslate-file').forEach(b => b.onclick = e => {
    e.stopPropagation(); if(!b.disabled) retranslateFile(+b.dataset.i);
  });
  list.querySelectorAll('.delete').forEach(b => b.onclick = e => {
    e.stopPropagation(); if(!b.disabled) deleteFile(+b.dataset.i);
  });
  list.querySelectorAll('.pri').forEach(b => b.onclick = e => {
    e.stopPropagation();
    if(!b.disabled) prioritizeNext(+b.dataset.i);
  });
  list.scrollTop = Math.min(savedScrollTop, Math.max(0, list.scrollHeight - list.clientHeight));
  taskListScrollTop = list.scrollTop;
  renderDetail();
  persist();
}
function setStatus(i, s, err){ files[i].status=s; files[i].error=err||''; }

function prioritizeNext(i){
  if(i < 0 || i >= files.length) return;
  const target = files[i];
  if(target.name === currentName || (jobId && target.status !== 'q')) return;
  const selectedFile = files[selectedIdx] || null;
  files.forEach(f => { f.priority = false; });
  target.priority = true;
  files.splice(i, 1);
  let insertAt = 0;
  if(jobId && currentName){
    const currentIndex = files.findIndex(f => f.name === currentName);
    insertAt = currentIndex >= 0 ? currentIndex + 1 : 0;
  }
  files.splice(insertAt, 0, target);
  selectedIdx = selectedFile ? files.indexOf(selectedFile) : insertAt;
  render();
  if(jobId) syncPriority();
  requestAnimationFrame(() => {
    const row = document.querySelector(`.file[data-fi="${files.indexOf(target)}"]`);
    if(row) row.scrollIntoView({block:'nearest'});
  });

function retryFile(i){

async function deleteFile(i){
  if(jobId || submitting || lineRetranslating || lineSaving || lineEditing || i < 0 || i >= files.length) return;
  const f = files[i];
  const diskName = f.output_name || (f.content_out !== null
    ? outputName(f.name, f.target_language || $('cfg_tgt').value)
    : '');
  const choice=await appModal({
    title:'删除任务',
    message:`请选择如何处理“${f.name}”。${diskName ? `\n\n关联磁盘译文：${diskName}` : '\n\n当前没有可识别的磁盘译文。'}`,
    actions:[
      {label:'仅从任务列表移除',value:'list',focus:true},
      {label:'从任务列表及磁盘删除',value:'disk',kind:'danger',disabled:!diskName},
      {label:'取消',value:null}
    ],
    cancelValue:null
  });
  if(!choice) return;
  if(choice==='disk'){
    try{
      const response = await fetch('/api/output?name=' + encodeURIComponent(diskName), {method:'DELETE'});
      const result = await response.json();
      if(!response.ok || !result.ok){
        await appAlert('磁盘译文删除失败：' + (result.error || response.status),'删除失败');
        return;

      await appAlert('磁盘译文删除失败：' + error.message,'删除失败');
      return;

  await releaseSource(f);
  const selectedFile = files[selectedIdx] || null;
  files.splice(i, 1);
  if(selectedFile === f){
    selectedIdx = files.length ? Math.min(i, files.length - 1) : -1;

    selectedIdx = selectedFile ? files.indexOf(selectedFile) : -1;

function setupCompareResize(){
  const wrap = document.querySelector('.compare-wrap');
  const handle = wrap && wrap.querySelector('.compare-splitter');
  if(!wrap || !handle) return;
  handle.addEventListener('pointerdown', e => {
    e.preventDefault(); handle.setPointerCapture(e.pointerId); handle.classList.add('dragging');
    document.body.classList.add('resizing');
    const rect = wrap.getBoundingClientRect();
    const startRatio=compareRatio, startX=e.clientX;
    let latestX=startX, targetRatio=startRatio, frame=0;
    const preview=()=>{
      frame=0;
      targetRatio=clamp((latestX-rect.left)/rect.width*100,25,75);
      const delta=(targetRatio-startRatio)/100*rect.width;
      handle.style.transform=`translate3d(${delta-3}px,0,0)`;
    };
    const move = ev => {
      latestX=ev.clientX;
      if(!frame) frame=requestAnimationFrame(preview);
    };
    const up = () => {
      if(frame){ cancelAnimationFrame(frame); preview(); }
      handle.classList.remove('dragging'); document.body.classList.remove('resizing');
      handle.style.transform='';
      handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      compareRatio=targetRatio;
      wrap.style.setProperty('--source-w', compareRatio + '%');
      localStorage.setItem('bench_compare_ratio', String(compareRatio));
    };
    handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
}
function appendOut(i, text, line){

  files[i].live_out = files[i].live_out || {};
  if(line !== undefined && line !== null && Number.isInteger(Number(line))){
    files[i].live_out[Number(line)] = text;
    files[i].last_stream_line = Number(line);
  }else{
    files[i].legacy_out = (files[i].legacy_out || '') + text + '\n';
  }
  const el = $('split-'+i);
  if(!el) return;
  const oldTop = el.scrollTop;
  const row = Number.isInteger(Number(line))
    ? el.querySelector(`.srow[data-line="${Number(line)}"]`) : null;
  const cell = row?.querySelector('.dcell');
  if(cell){
    cell.textContent = text || '…';
    cell.classList.toggle('empty', !text);
  }else{
    el.innerHTML = splitHtml(i);
    el.scrollTop = oldTop;
  }
  if(trackingProgress && files[i].name===currentName && !streamScrollFrame){
    streamScrollFrame = requestAnimationFrame(() => {
      streamScrollFrame = 0;
      scrollToLatestTranslation(i);
    });
  }
}
function scrollToLatestTranslation(fi){
  const el=$('split-'+fi); if(!el) return;
  const exact=Number.isInteger(files[fi]?.last_stream_line)
    ? el.querySelector(`.srow[data-line="${files[fi].last_stream_line}"]`) : null;
  const translated=exact ? [] : [...el.querySelectorAll('.srow')].filter(row => {
    const cell=row.querySelector('.dcell');
    return cell && !cell.classList.contains('empty');
  });
  const latest=exact || translated[translated.length-1];
  if(latest) el.scrollTop=Math.max(0, latest.offsetTop-el.clientHeight*.62);
}
function focusCurrentProgress(){
  if(!currentName) return;
  const fi=fileIdx(currentName);
  if(fi < 0) return;
  selectedIdx=fi;
  render();
  requestAnimationFrame(() => {
    scrollToLatestTranslation(fi);
    const row=document.querySelector(`.file[data-fi="${fi}"]`);
    if(row) row.scrollIntoView({block:'nearest'});
  });
}

function setChip(i, status){
  if(!files[i]) return;
  files[i].status = status;   // 同步状态, 避免 render 时读到旧值
  const row = document.querySelector(`.file[data-fi="${i}"]`);
  if(!row) return;
  const chip = row.querySelector('.st');
  const stMap = {q:['待译','q'], run:['翻译中','run'], ok:['完成','ok'], err:['失败','err']};
  const [label, cls] = stMap[status] || ['待译','q'];
  chip.textContent = label; chip.className = 'st ' + cls;
  if(i===selectedIdx){
    $('detailMeta').textContent=detailMetaFor(files[i]);
    updateDetailControls();
  }
}

/* ---------- 持久化: 刷新后恢复文件列表与译文 ---------- */
let persistTimer=null;
let stateDbPromise=null;
function openStateDb(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB unavailable'));
  if(stateDbPromise) return stateDbPromise;
  stateDbPromise=new Promise((resolve,reject) => {
    const request=indexedDB.open('translation-bench-state',1);
    request.onupgradeneeded=() => {
      if(!request.result.objectStoreNames.contains('state')) request.result.createObjectStore('state');
    };
    request.onsuccess=() => resolve(request.result);
    request.onerror=() => reject(request.error||new Error('IndexedDB open failed'));
  });
  return stateDbPromise;
}
async function saveIndexedFiles(data){
  const db=await openStateDb();
  await new Promise((resolve,reject) => {
    const transaction=db.transaction('state','readwrite');
    transaction.objectStore('state').put(data,'files');
    transaction.oncomplete=resolve;
    transaction.onerror=() => reject(transaction.error||new Error('IndexedDB write failed'));
    transaction.onabort=() => reject(transaction.error||new Error('IndexedDB write aborted'));
  });
}
async function loadIndexedFiles(){
  const db=await openStateDb();
  return new Promise((resolve,reject) => {
    const transaction=db.transaction('state','readonly');
    const request=transaction.objectStore('state').get('files');
    request.onsuccess=() => resolve(request.result||null);
    request.onerror=() => reject(request.error||new Error('IndexedDB read failed'));
  });
}
function persistentSnapshot(){
  return files.map(f => ({name:f.name, status:f.status, error:f.error, content_out:f.content_out,
    content:f.content, live_out:{...(f.live_out||{})}, completed_lines:{...(f.completed_lines||{})},
    resume_retranslate:!!f.resume_retranslate, legacy_out:f.legacy_out||'', output_name:f.output_name||null,
    target_language:f.target_language||null, priority:f.priority||false, retry_queued:!!f.retry_queued,
    source_id:f.source_id||null, source_format:f.source_format||'text', source_sha256:f.source_sha256||null,
    text_eol:f.text_eol||'lf', text_bom:!!f.text_bom, pdf_page_count:f.pdf_page_count||null,
    pdf_page_start:f.pdf_page_start||null, pdf_page_end:f.pdf_page_end||null,
    pdf_page_selection:f.pdf_page_selection||null,
    pdf_extraction_version:f.pdf_extraction_version||null}));
}
function persist(){
  try{
    const data=persistentSnapshot();
    saveIndexedFiles(data).catch(() => {});
    let compact=data, serialized=JSON.stringify(compact);
    if(serialized.length>3200000){
      compact=data.map(item => {
        const copy={...item};
        if(copy.source_format!=='text') delete copy.content;
        delete copy.live_out;
        delete copy.legacy_out;
        if(copy.status==='ok'&&copy.output_name) delete copy.content_out;
        return copy;
      });
      serialized=JSON.stringify(compact);
    }
    // 超大状态以 IndexedDB 为准；不用一份丢了原文/检查点的
    // localStorage 快照覆盖上一份尚可恢复的数据。
    if(serialized.length<=3200000) localStorage.setItem('bench_files',serialized);
  }catch(e){}
}
function schedulePersist(){
  if(persistTimer) return;
  persistTimer=setTimeout(() => { persistTimer=null; persist(); }, 750);
}
function flushPersist(){
  if(persistTimer){ clearTimeout(persistTimer); persistTimer=null; }
  persist();
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='hidden') flushPersist();
});
window.addEventListener('beforeunload', flushPersist);
async function restoreFiles(){
  try{
    let saved=await loadIndexedFiles().catch(() => null);
    if(!Array.isArray(saved)) saved=JSON.parse(localStorage.getItem('bench_files'));
    if(Array.isArray(saved)){
      files = saved.map(f => {
        const sourceFormat=f.source_format||'text';
        let content=Object.prototype.hasOwnProperty.call(f,'content') ? f.content : null;
        let textEol=f.text_eol||'lf', textBom=!!f.text_bom;
        if(sourceFormat==='text' && typeof content==='string'){
          const normalized=normalizeTextSource(content);
          content=normalized.content;
          if(!f.text_eol) textEol=normalized.text_eol;
          if(!Object.prototype.hasOwnProperty.call(f,'text_bom')) textBom=normalized.text_bom;
        }
        const contentOut=typeof f.content_out==='string'
          ? normalizeTextSource(f.content_out).content
          : (f.content_out ?? null);
        const completedLines=f.completed_lines||{};
        const liveOut=Object.prototype.hasOwnProperty.call(f,'live_out')
          ? (f.live_out||{})
          : {...completedLines};
        return {name:f.name, status:f.status||'q', error:f.error||'',
          content_out:contentOut, content,
          live_out:liveOut, completed_lines:completedLines,
          resume_retranslate:!!f.resume_retranslate,
          legacy_out:f.legacy_out||f.out||'', output_name:f.output_name||null,
          target_language:f.target_language||null, priority:!!f.priority, retry_queued:!!f.retry_queued,
          source_id:f.source_id||null, source_format:sourceFormat,
          source_sha256:f.source_sha256||null, text_eol:textEol, text_bom:textBom,
          pdf_page_count:f.pdf_page_count||null, pdf_page_start:f.pdf_page_start||null,
          pdf_page_end:f.pdf_page_end||null,
          pdf_page_selection:f.pdf_page_selection||null,
          pdf_extraction_version:f.pdf_extraction_version||null};
      });
      if(files.length) render();
    }
  }catch(e){}
}
async function markOutputsDone(){
  // 仅在源文哈希和目标语言都一致时恢复，避免同名旧译文被误用。
  try{
    let changed = false;
    const refreshedPdfSources=new Set();
    for(const f of files){
      const needsPdfInfo=String(f.source_format||'').toLowerCase()==='pdf' && !f.pdf_page_count;
      const stalePdfParser=String(f.source_format||'').toLowerCase()==='pdf' &&
        Number(f.pdf_extraction_version||0)!==PDF_EXTRACTION_VERSION;
      if((typeof f.content==='string' && !needsPdfInfo && !stalePdfParser) || !f.source_id ||
        !BINARY_DOCUMENT_EXTENSIONS.includes(fileExtension(f.name))) continue;
      const sourceResponse=await fetch('/api/source?id=' + encodeURIComponent(f.source_id) +
        '&format=' + encodeURIComponent(f.source_format||fileExtension(f.name).slice(1)) +
        '&sha256=' + encodeURIComponent(f.source_sha256||'') +
        (String(f.source_format||'').toLowerCase()==='pdf'
          ? '&pages=' + encodeURIComponent(
              formatPdfPageSelection(pdfPageNumbers(f), Number(f.pdf_page_count||0)) || 'all'
            )
          : ''));
      const source=await sourceResponse.json().catch(() => ({}));
      if(sourceResponse.ok && typeof source.content==='string'){
        const contentChanged=typeof f.content==='string' && f.content!==source.content;
        f.content=source.content;
        changed=true;
        if(source.pdf_page_count){
          f.pdf_page_count=source.pdf_page_count;
          f.pdf_page_start=source.pdf_page_start;
          f.pdf_page_end=source.pdf_page_end;
          f.pdf_page_selection=source.pdf_page_selection||'all';
          f.pdf_extraction_version=source.pdf_extraction_version||PDF_EXTRACTION_VERSION;
        }
        if(contentChanged){
          refreshedPdfSources.add(f.name);
          f.status='q'; f.error=''; f.content_out=null; f.live_out={};
          f.completed_lines={}; f.resume_retranslate=false; f.legacy_out='';
          f.output_name=null; f.target_language=null; f.retry_queued=false;
        }
      }
    }
    const r = await fetch('/api/history');
    const d = await r.json();
    const outs = new Map((d.files||[]).map(f => [f.name,f]));
    const currentCfg = readCfg();
    const target = currentCfg.tgt;
    for(const f of files){
      if(refreshedPdfSources.has(f.name)) continue;
      if(f.content_out !== null || typeof f.content !== 'string') continue;
      const outName = outputName(f.name, target), entry = outs.get(outName);
      if(!entry || entry.source_name !== f.name || entry.target_language !== target || !entry.source_sha256) continue;
      let hash=f.source_sha256||'';
      if(!hash){
        const bytes = new TextEncoder().encode(f.content);
        hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))]
          .map(b => b.toString(16).padStart(2,'0')).join('');
      }
      if(hash !== entry.source_sha256) continue;
      if(String(f.source_format||'').toLowerCase()==='pdf' && (
        Number(entry.pdf_extraction_version||0)!==PDF_EXTRACTION_VERSION ||
        Number(entry.pdf_page_start||1)!==Number(f.pdf_page_start||1) ||
        Number(entry.pdf_page_end||entry.pdf_page_count)!==Number(f.pdf_page_end||f.pdf_page_count) ||
        formatPdfPageSelection(pdfPageNumbers(entry), Number(entry.pdf_page_count||0)) !==
          formatPdfPageSelection(pdfPageNumbers(f), Number(f.pdf_page_count||0)) ||
        Boolean(entry.pdf_strict_layout)!==Boolean(currentCfg.pdfStrict)
      )) continue;
      const rr = await fetch('/api/output?name=' + encodeURIComponent(outName));
      const restored = await rr.json();
      if(!rr.ok || typeof restored.content !== 'string') continue;
      f.status = 'ok'; f.content_out = restored.content; f.output_name = outName;
      f.target_language = target; f.live_out = {}; f.completed_lines = {};
      f.resume_retranslate = false; f.legacy_out = '';
      changed = true;
    }
    if(changed) render();
  }catch(e){}
}

/* ---------- 翻译 ---------- */
function connectSSE(jid){
  if(es) es.close();
  es = new EventSource('/api/stream?job=' + jid);
  es.addEventListener('chunk', e => {
    const d = JSON.parse(e.data); const fi = fileIdx(d.file);
    if(fi >= 0) appendOut(fi, d.text||'', d.line);
  });
  es.addEventListener('line_done', e => {
    try{
      const d=JSON.parse(e.data), fi=fileIdx(d.file);
      if(fi >= 0){
        appendOut(fi, d.text||'', d.line);
        files[fi].completed_lines=files[fi].completed_lines||{};
        files[fi].completed_lines[String(d.line)]=d.text||'';
        schedulePersist();
      }
    }catch(_){}
  });
  es.addEventListener('fail', e => {
    try{
      const d = JSON.parse(e.data), fi = fileIdx(d.file);
      if(fi >= 0){
        files[fi].error=d.msg||'翻译失败';
        files[fi].live_out={...(files[fi].completed_lines||{})};
        files[fi].legacy_out='';
        setChip(fi,'err'); render();
      }
    }catch(_){}
  });
  es.addEventListener('file_reset', e => {
    try{
      const d = JSON.parse(e.data), fi = fileIdx(d.file);
      if(fi >= 0){
        // 兼容仍在运行的旧后端：旧版本中断时会发送 file_reset。
        // 这里只恢复任务状态，绝不能再删除已经显示的译文。
        files[fi].error='';
        setChip(fi,'q'); render();
      }
    }catch(_){}
  });
  es.addEventListener('progress', e => {
    try{
      const d = JSON.parse(e.data), fi = fileIdx(d.current);
      currentName = d.current || currentName;
      updateDetailControls();
      $('cur').textContent = d.current ? '正在翻译：' + d.current + ' …' : '';
      updateTotalProgress(d.done, d.total);
      updateFileProgress(0, 0);
      if(fi >= 0){ setChip(fi,'run'); if(trackingProgress) focusCurrentProgress(); }
      document.querySelectorAll('.file.current').forEach(row => row.classList.remove('current'));
      const currentRow = document.querySelector(`.file[data-fi="${fi}"]`);
      if(currentRow){
        currentRow.classList.add('current');
        const priorityButton = currentRow.querySelector('.pri');
        if(priorityButton) priorityButton.classList.remove('on');
      }
      if(fi >= 0) files[fi].priority = false;
    }catch(_){}
  });
  es.addEventListener('file_progress', e => {
    try{ const d = JSON.parse(e.data); updateFileProgress(d.done, d.total); }catch(_){}
  });
  es.addEventListener('overall_progress', e => {
    try{ const d = JSON.parse(e.data); updateTotalProgress(d.done, d.total); }catch(_){}
  });
  es.addEventListener('file_done', e => {
    try{
      const d = JSON.parse(e.data), fi = fileIdx(d.file);
      if(fi >= 0) setChip(fi,'ok');
      updateFileProgress(d.done, d.total, true);
    }catch(_){}
  });
  es.addEventListener('done', () => { es.close(); poll(true); });
  es.addEventListener('interrupted', () => { es.close(); poll(true); });
  es.onerror = () => {
    if(es) es.close();
    if(jobId) setTimeout(() => { if(jobId) connectSSE(jobId); }, 2000);
  };
}

function syncPriority(){
  if(!jobId) return;
  const names = files.filter(f => f.priority).map(f => f.name);
  fetch('/api/prioritize', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({job:jobId, names})}).catch(()=>{});
}

function resumableLines(f){
  const completed=f?.completed_lines||{};
  const result={};
  for(const [line,text] of Object.entries(completed)){
    if(typeof text==='string' && text.trim()) result[String(line)]=text;
  }
  return result;
}

async function submitJob(subFiles, {retranslate=false}={}){
  if(submitting || jobId || lineRetranslating || lineSaving || lineEditing || !subFiles.length) return;
  submitting = true;
  try{
    render();
  }catch(error){
    submitting = false;
    console.error('启动前渲染失败', error);
    await appAlert('启动失败：无法渲染任务内容，请重新添加文件后重试。','启动失败');
    return;
  }
  const submissionPlans=subFiles.map(f => {
    const wantsRetranslate=!!retranslate || !!f.resume_retranslate;
    const canResume=!retranslate || !!f.resume_retranslate;
    return {f, wantsRetranslate, resume:canResume ? resumableLines(f) : {}};
  });
  const payload = {
    config:requestConfig(),
    files: submissionPlans.map(({f,wantsRetranslate,resume}) => {
      const item={
        name:f.name, content:f.content,
        source_id:f.source_id||null, source_format:f.source_format||'text',
        source_sha256:f.source_sha256||null, text_eol:f.text_eol||'lf',
        text_bom:!!f.text_bom, pdf_page_count:f.pdf_page_count||null,
        pdf_page_start:f.pdf_page_start||null, pdf_page_end:f.pdf_page_end||null,
        pdf_page_selection:f.pdf_page_selection||null
      };
      if(Object.keys(resume).length) item.resume_lines=resume;
      if(wantsRetranslate){
        item.retranslate=true;
        item.translated_content=typeof f.content_out==='string' ? f.content_out : '';
      }
      return item;
    }),
    priority: subFiles.filter(f => f.priority).map(f => f.name)
  };
  const controller=new AbortController();
  const submitTimeout=setTimeout(() => controller.abort(), 30000);
  try{
    const r = await fetch('/api/translate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload), signal:controller.signal
    });
    const d = await r.json().catch(() => ({}));
    if(!r.ok || d.error || !d.job) throw new Error(d.error || `HTTP ${r.status}`);
    jobId = d.job; jobNames = subFiles.map(f => f.name);
    interrupted = false; currentName = ''; lastJob = null;
    interrupting = false;
    submissionPlans.forEach(({f,wantsRetranslate,resume}) => {
      f.status='q'; f.error=''; f.live_out={...resume}; f.completed_lines={...resume};
      f.resume_retranslate=wantsRetranslate; f.legacy_out='';
      if(!wantsRetranslate){ f.content_out=null; f.output_name=null; f.target_language=null; }
      f.retry_queued=false;
    });
    updateTotalProgress(0, subFiles.length);
    updateFileProgress(0, 0);
    $('btnStop').disabled = false;
    localStorage.setItem('bench_job', jobId);
    connectSSE(jobId);
    $('progressBox').style.display='block';
    pollTimer = setInterval(() => poll(false), 15000);
  }catch(e){
    const message=e.name==='AbortError' ? '启动超时，现有任务和译文未被修改' : e.message;
    await appAlert('启动失败：' + message,'启动失败');
  }finally{
    clearTimeout(submitTimeout);
    submitting = false;
    render();
  }
}

$('btnGo').addEventListener('click', () => submitJob(unfinishedFiles()));
$('btnCurrentGo').addEventListener('click', () => {

});
async function clearCurrentTranslation(){

  const f=files[selectedIdx];
  if(!f) return;
  const hasTranslation=f.content_out!==null || Object.keys(f.live_out||{}).length ||
    Object.keys(f.completed_lines||{}).length || !!f.legacy_out;

function applyPartials(partials){
  for(const [name, lines] of Object.entries(partials||{})){
    const fi = fileIdx(name); if(fi < 0) continue;
    files[fi].live_out = files[fi].live_out || {};
    for(const [line, text] of Object.entries(lines||{})){
      if(files[fi].live_out[line] !== text) appendOut(fi, text, Number(line));
    }
  }
}

function applyCompletedPartials(completed){
  let changed=false;
  for(const [name, lines] of Object.entries(completed||{})){
    const fi=fileIdx(name); if(fi < 0) continue;
    files[fi].completed_lines=files[fi].completed_lines||{};
    for(const [line,text] of Object.entries(lines||{})){
      if(files[fi].completed_lines[String(line)]!==text){
        files[fi].completed_lines[String(line)]=text;
        changed=true;
      }
      if((files[fi].live_out||{})[String(line)]!==text){
        appendOut(fi,text,Number(line));
      }
    }
  }
  if(changed) persist();
}

function applyResults(results){
  (results||[]).forEach(res => {
    const fi = fileIdx(res.name); if(fi < 0) return;
    if(res.status==='ok'){
      files[fi].content_out = res.content;
      files[fi].output_name = res.output_name || outputName(res.name, readCfg().tgt);
      files[fi].target_language = res.target_language || readCfg().tgt;
      files[fi].live_out = {}; files[fi].completed_lines = {};
      files[fi].resume_retranslate = false; files[fi].legacy_out = '';
      setChip(fi,'ok');
    }else{
      files[fi].error = res.error || '翻译失败';
      setChip(fi,'err');
    }
  });
}

async function poll(forceFull=false){
  if(!jobId) return;
  if(pollBusy){
    if(forceFull) setTimeout(() => poll(true), 500);
    return;
  }
  pollBusy = true;
  let d;
  try{
    const r = await fetch('/api/status?job=' + jobId + (forceFull ? '&full=1' : ''));
    d = await r.json();
  }catch(e){ pollBusy = false; return; }
  pollBusy = false;
  if(d.status === 'notfound'){
    clearInterval(pollTimer); jobId=null; interrupting=false;
    localStorage.removeItem('bench_job'); render(); return;
  }
  updateTotalProgress(d.done, d.total);
  updateFileProgress(d.current_file_done, d.current_file_total);
  $('cur').textContent = d.current ? '正在翻译：' + d.current + ' …' : '';
  currentName = d.current || currentName;
  updateDetailControls();
  if(d.current && trackingProgress) focusCurrentProgress();
  applyPartials(d.partials);
  applyCompletedPartials(d.completed_partials);
  const doneN = d.done_names || [];
  (d.names||[]).forEach((name) => {
    const fi = fileIdx(name); if(fi < 0) return;
    if(doneN.includes(name)) setChip(fi,'ok');
    else if(name === d.current && d.status==='running') setChip(fi,'run');
  });
  applyResults((d.results||[]).filter(r => r.status === 'error'));
  if(d.status === 'done' || d.status === 'interrupted'){
    const queuedRetries = files.filter(f => f.retry_queued && typeof f.content === 'string');
    clearInterval(pollTimer); lastJob = jobId; jobId = null;
    interrupted = (d.status === 'interrupted');
    interrupting = false;
    localStorage.removeItem('bench_job'); localStorage.setItem('bench_lastjob', lastJob);
    applyResults(d.results);
    if(interrupted){
      files.forEach(f => {
        if(f.status === 'run'){
          f.status='q'; f.error='';
        }
      });
    }
    currentName = ''; trackingProgress=false;
    $('btnStop').disabled = false;
    $('btnStop').textContent = '中断';
    $('cur').textContent = interrupted ? '已中断（点「开始翻译」继续剩余文件）' : '全部完成';
    $('btnGo').disabled = files.length === 0;
    $('btnZip').disabled = !d.results.some(r => r.status==='ok');
    render();
    if(!interrupted && queuedRetries.length) setTimeout(() => submitJob(queuedRetries), 0);
  }
}

function download(i){
  const f = files[i];
  if(f.content_out === null) return;
  const output=f.output_name || outputName(f.name, readCfg().tgt);
  if(f.output_name || BINARY_DOCUMENT_EXTENSIONS.includes(fileExtension(output))){
    const a=document.createElement('a');
    a.href='/api/output-file?name=' + encodeURIComponent(output);
    a.download=output;
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  const blob = new Blob([f.content_out], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = output;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

$('btnTest').addEventListener('click', ping);
$('cfg_thinking').addEventListener('click', () => {

});
$('cfg_pdf_strict').addEventListener('click', () => {

$('btnSave').addEventListener('click', () => {

$('cfg_tgt').addEventListener('change', () => {

});

$('btnZip').addEventListener('click', () => {
  const id = lastJob || jobId || localStorage.getItem('bench_lastjob');
  if(!id) return;
  const a = document.createElement('a');
  a.href = '/api/download?job=' + id;
  a.download = 'translated.zip';
  document.body.appendChild(a); a.click(); a.remove();
});

/* ---------- 刷新后恢复: 恢复文件列表 + 接回运行中的任务 ---------- */
async function reconnectJob(){
  let jid = localStorage.getItem('bench_job');
  async function findRunningJob(){
    try{ const r = await fetch('/api/running'); const d = await r.json(); return d.job || null; }catch(e){ return null; }
  }
  if(!jid) jid = await findRunningJob();
  if(!jid) return;
  try{
    let r = await fetch('/api/status?job=' + jid + '&full=1');
    let d = await r.json();
    if(!d.status || d.status === 'notfound'){
      localStorage.removeItem('bench_job');
      jid = await findRunningJob();
      if(!jid) return;
      r = await fetch('/api/status?job=' + jid + '&full=1');
      d = await r.json();
      if(!d.status || d.status === 'notfound') return;
    }
    const sources = Array.isArray(d.sources) ? d.sources : (d.names||[]).map(name => ({name, content:null}));
    for(const source of sources){
      let file = files.find(f => f.name === source.name);
      if(!file){
        file = {name:source.name, content:null, status:'q', error:'', content_out:null,
          live_out:{}, completed_lines:{}, resume_retranslate:false, legacy_out:'',
          output_name:null, target_language:null, priority:false, retry_queued:false,
          source_id:null, source_format:'text', source_sha256:null,
          text_eol:'lf', text_bom:false, pdf_page_count:null,
          pdf_page_start:null, pdf_page_end:null, pdf_page_selection:null,
          pdf_extraction_version:null};
        files.push(file);
      }
      if(typeof source.content === 'string') file.content = source.content;
      file.source_id=source.source_id||file.source_id||null;
      file.source_format=source.source_format||file.source_format||'text';
      file.source_sha256=source.source_sha256||file.source_sha256||null;
      file.pdf_page_count=source.pdf_page_count||file.pdf_page_count||null;
      file.pdf_page_start=source.pdf_page_start||file.pdf_page_start||null;
      file.pdf_page_end=source.pdf_page_end||file.pdf_page_end||null;
      file.pdf_page_selection=source.pdf_page_selection||file.pdf_page_selection||null;
      file.pdf_extraction_version=source.pdf_extraction_version||file.pdf_extraction_version||null;
      file.text_eol=source.text_eol||file.text_eol||'lf';
      file.text_bom=source.text_bom===undefined ? !!file.text_bom : !!source.text_bom;
    }
    currentName = d.current || '';
    $('cur').textContent = d.current ? '正在翻译：' + d.current + ' …' : '';
    updateTotalProgress(d.done, d.total);
    updateFileProgress(d.current_file_done, d.current_file_total);
    applyPartials(d.partials); applyCompletedPartials(d.completed_partials); applyResults(d.results);
    if(d.status === 'done' || d.status === 'interrupted'){
      interrupted = d.status === 'interrupted'; lastJob = jid; jobId = null;
      interrupting = false;
      if(interrupted){
        files.forEach(f => {
          if(f.status === 'run'){
            f.status='q'; f.error='';
          }
        });
      }
      localStorage.removeItem('bench_job'); localStorage.setItem('bench_lastjob', jid);
      render(); return;
    }
    jobId = jid; jobNames = d.names || [];
    connectSSE(jobId);
    $('progressBox').style.display='block';
    pollTimer = setInterval(() => poll(false), 15000);
    render();
  }catch(e){}
}
async function init(){
  await restoreFiles();
  lastJob = localStorage.getItem('bench_lastjob');
  await reconnectJob();
  await markOutputsDone();
  render();
}
init();
